<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자이너 유형 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <section id="intro-screen" class="screen active">
    <div class="card">
      <p class="eyebrow">DESIGNER TYPE TEST</p>
      <h1>나는 어떤 디자이너일까?</h1>
      <p class="desc">8개의 질문에 답하고 나의 디자이너 유형을 알아보세요.</p>
      <button id="start-btn" class="btn primary">테스트 시작하기</button>
    </div>
  </section>

  <section id="quiz-screen" class="screen">
    <div class="card">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="question-count" class="question-count"></p>
      <h2 id="question-text" class="question-text"></h2>
      <div id="options" class="options"></div>
    </div>
  </section>

  <section id="result-screen" class="screen">
    <div class="card">
      <p class="eyebrow">YOUR RESULT</p>
      <div id="result-emoji" class="result-emoji"></div>
      <h1 id="result-title" class="result-title"></h1>
      <p id="result-desc" class="result-desc"></p>
      <div id="result-tags" class="result-tags"></div>
      <button id="restart-btn" class="btn primary">다시 테스트하기</button>
    </div>
  </section>

</div>
<script src="script.js"></script>
</body>
</html>
